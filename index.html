<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Historias que Inspiran</title>

  <link rel="stylesheet" href="./css/styles.css">


  <!-- ================================================= -->
  <!-- A-FRAME -->
  <!-- ================================================= -->

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- ================================================= -->
  <!-- A-FRAME EXTRAS -->
  <!-- ================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>


  <!-- ================================================= -->
  <!-- MINDAR -->
  <!-- ================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>


  <!-- ================================================= -->
  <!-- TARJETA DE INFORMACIÓN -->
  <!-- ================================================= -->

  <section
    id="story-card"
    class="story-card hidden"
    aria-live="polite"
  >

    <h2 id="story-name"></h2>

    <p id="story-quote"></p>

    <button
      id="audio-button"
      type="button"
    >
      ▶ Escuchar
    </button>

    <audio
      id="story-audio"
      preload="none"
    ></audio>

  </section>



  <!-- ================================================= -->
  <!-- CONTENEDOR DE LA IMAGEN FIJA -->
  <!-- ================================================= -->

  <div
    id="fixed-image-container"
  >

    <img
      id="fixed-image"
      src=""
      alt=""
      draggable="false"
    >

  </div>



  <!-- ================================================= -->
  <!-- BOTÓN X -->
  <!-- ================================================= -->

  <button
    id="close-ar"
    type="button"
    aria-label="Cerrar imagen"
  >
    ✕
  </button>



  <!-- ================================================= -->
  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <!-- ================================================= -->

  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets/targets.mind;
      uiError: yes;
      uiLoading: yes;
      uiScanning: no;
      missTolerance: 30;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >



    <!-- ================================================= -->
    <!-- RECURSOS -->
    <!-- ================================================= -->

    <a-assets timeout="15000">


      <!-- =============================================== -->
      <!-- IMAGEN DE DENISSE -->
      <!-- =============================================== -->

      <img
        id="overlay-denisse"
        src="./assets/images/denisse.png"
      >


      <!-- =============================================== -->
      <!-- IMAGEN DE ESTHER -->
      <!-- =============================================== -->

      <img
        id="overlay-esther"
        src="./assets/images/esther-06.png"
      >


      <!-- =============================================== -->
      <!-- IMAGEN DE RUBÍ -->
      <!-- =============================================== -->

      <img
        id="overlay-rubi"
        src="./assets/images/rubí.png"
      >


      <!-- =============================================== -->
      <!-- IMAGEN DE MARÍA -->
      <!-- =============================================== -->

      <img
        id="overlay-maria"
        src="./assets/images/maria.png"
      >


      <!-- =============================================== -->
      <!-- IMAGEN DE PATRICIA -->
      <!-- =============================================== -->

      <img
        id="overlay-patricia"
        src="./assets/images/patricia.png"
      >


      <!-- =============================================== -->
      <!-- IMAGEN DE MÓNICA -->
      <!-- =============================================== -->

      <img
        id="overlay-monica"
        src="./assets/images/monica.png"
      >


      <!-- =============================================== -->
      <!-- MODELO 3D -->
      <!-- =============================================== -->

      <a-asset-item
        id="modelo-mujeres"
        src="./assets/models/mural.glb"
      ></a-asset-item>


    </a-assets>



    <!-- ================================================= -->
    <!-- CÁMARA -->
    <!-- ================================================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>



    <!-- ================================================= -->
    <!-- TARGET 0 -->
    <!-- MURAL 3D -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-person-id="titulo"
    >

      <a-gltf-model

        id="modelo-mujeres-ar"

        src="#modelo-mujeres"

        position="0 0 0.05"

        rotation="0 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer

      ></a-gltf-model>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 1 -->
    <!-- DENISSE -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 1"
      data-person-id="denisse"
    >

      <a-image

        id="ar-denisse"

        src="#overlay-denisse"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 2 -->
    <!-- ESTHER -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 2"
      data-person-id="esther"
    >

      <a-image

        id="ar-esther"

        src="#overlay-esther"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 3 -->
    <!-- RUBÍ -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 3"
      data-person-id="rubi"
    >

      <a-image

        id="ar-rubi"

        src="#overlay-rubi"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 4 -->
    <!-- MARÍA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 4"
      data-person-id="maria"
    >

      <a-image

        id="ar-maria"

        src="#overlay-maria"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 5 -->
    <!-- PATRICIA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 5"
      data-person-id="patricia"
    >

      <a-image

        id="ar-patricia"

        src="#overlay-patricia"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 6 -->
    <!-- MÓNICA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 6"
      data-person-id="monica"
    >

      <a-image

        id="ar-monica"

        src="#overlay-monica"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>


  </a-scene>



  <!-- ================================================= -->
  <!-- ARCHIVOS DEL PROYECTO -->
  <!-- ================================================= -->

  <script src="./js/audio.js"></script>

  <script src="./js/app.js"></script>

  <script src="./js/ar.js"></script>



  <!-- ================================================= -->
  <!-- CONTROL DE IMÁGENES FIJAS -->
  <!-- ================================================= -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        /* =================================================
         * ELEMENTOS
         * ================================================= */

        const fixedContainer =
          document.getElementById(
            "fixed-image-container"
          );


        const fixedImage =
          document.getElementById(
            "fixed-image"
          );


        const closeButton =
          document.getElementById(
            "close-ar"
          );



        /* =================================================
         * VARIABLES
         * ================================================= */

        let currentTarget = null;

        let isLocked = false;



        /* =================================================
         * IMÁGENES
         * ================================================= */

        const targetImages = {

          denisse:
            "./assets/images/denisse.png",

          esther:
            "./assets/images/esther-06.png",

          rubi:
            "./assets/images/rubí.png",

          maria:
            "./assets/images/maria.png",

          patricia:
            "./assets/images/patricia.png",

          monica:
            "./assets/images/monica.png"

        };



        /* =================================================
         * FUNCIÓN:
         * LIMPIAR COMPLETAMENTE LA IMAGEN ANTERIOR
         * ================================================= */

        function clearFixedImage() {

          /*
           * Quitar cualquier clase visible
           */

          fixedContainer.classList.remove(
            "show"
          );


          /*
           * Quitar imagen
           */

          fixedImage.removeAttribute(
            "src"
          );


          /*
           * Quitar texto alternativo
           */

          fixedImage.removeAttribute(
            "alt"
          );


          /*
           * Por seguridad, limpiar
           * cualquier contenido adicional
           */

          while (
            fixedContainer.children.length > 1
          ) {

            fixedContainer.removeChild(
              fixedContainer.lastElementChild
            );

          }

        }



        /* =================================================
         * FUNCIÓN:
         * MOSTRAR UNA SOLA IMAGEN
         * ================================================= */

        function showFixedImage(
          target
        ) {


          /*
           * Obtener persona
           */

          const personId =
            target.getAttribute(
              "data-person-id"
            );


          console.log(
            "Mostrando:",
            personId
          );


          /*
           * Obtener imagen
           */

          const imageSrc =
            targetImages[
              personId
            ];


          /*
           * Si no existe,
           * desbloquear
           */

          if (!imageSrc) {

            console.log(
              "No existe imagen para:",
              personId
            );

            isLocked = false;

            currentTarget = null;

            return;

          }



          /*
           * =============================================
           * PRIMERO LIMPIAMOS CUALQUIER IMAGEN
           * ANTERIOR
           * =============================================
           */

          clearFixedImage();



          /*
           * =============================================
           * ASIGNAMOS SOLAMENTE LA NUEVA IMAGEN
           * =============================================
           */

          fixedImage.src =
            imageSrc;


          fixedImage.alt =
            "Historia de " + personId;



          /*
           * =============================================
           * MOSTRAR IMAGEN
           * =============================================
           */

          fixedContainer.classList.add(
            "show"
          );



          /*
           * =============================================
           * MOSTRAR X
           * =============================================
           */

          closeButton.classList.add(
            "visible"
          );



          /*
           * =============================================
           * OCULTAR LA IMAGEN CONTROLADA
           * POR MINDAR
           * =============================================
           */

          target.object3D.visible =
            false;


          console.log(
            "Imagen única mostrada correctamente."
          );

        }



        /* =================================================
         * REGISTRAR TARGETS
         * ================================================= */

        const targets =
          document.querySelectorAll(
            "[mindar-image-target]"
          );


        targets.forEach(
          function (target) {


            /* =============================================
             * TARGET ENCONTRADO
             * ============================================= */

            target.addEventListener(
              "targetFound",
              function () {


                const personId =
                  target.getAttribute(
                    "data-person-id"
                  );


                console.log(
                  "Target encontrado:",
                  personId
                );



                /*
                 * =========================================
                 * TARGET 0
                 * =========================================
                 *
                 * Es el modelo 3D.
                 *
                 * Lo dejamos funcionando
                 * exactamente como estaba.
                 */

                if (
                  personId === "titulo"
                ) {

                  return;

                }



                /*
                 * =========================================
                 * SI YA EXISTE UNA IMAGEN
                 * =========================================
                 *
                 * No permitimos que otro marcador
                 * cree una segunda imagen.
                 *
                 * Primero debe presionarse X.
                 */

                if (isLocked) {

                  console.log(
                    "Ya existe una imagen visible."
                  );

                  return;

                }



                /*
                 * =========================================
                 * BLOQUEAR
                 * =========================================
                 */

                isLocked = true;


                currentTarget =
                  target;



                /*
                 * =========================================
                 * ESPERAR CONFIRMACIÓN
                 * =========================================
                 */

                setTimeout(
                  function () {


                    /*
                     * Verificar que todavía
                     * sea el target actual.
                     */

                    if (
                      currentTarget ===
                      target &&
                      isLocked
                    ) {


                      showFixedImage(
                        target
                      );

                    }

                  },
                  400
                );

              }
            );



            /* =============================================
             * TARGET PERDIDO
             * ============================================= */

            target.addEventListener(
              "targetLost",
              function () {


                console.log(
                  "Target perdido:",
                  target.getAttribute(
                    "data-person-id"
                  )
                );


                /*
                 * NO eliminamos la imagen.
                 *
                 * Se queda fija hasta presionar X.
                 */

              }
            );

          }
        );



        /* =================================================
         * BOTÓN X
         * ================================================= */

        closeButton.addEventListener(
          "click",
          function () {


            console.log(
              "Cerrando imagen actual..."
            );



            /*
             * =============================================
             * OCULTAR X INMEDIATAMENTE
             * =============================================
             */

            closeButton.classList.remove(
              "visible"
            );



            /*
             * =============================================
             * ELIMINAR IMAGEN
             * =============================================
             */

            clearFixedImage();



            /*
             * =============================================
             * RESTAURAR TARGET
             * =============================================
             */

            if (
              currentTarget
            ) {

              currentTarget.object3D.visible =
                true;

            }



            /*
             * =============================================
             * LIMPIAR REFERENCIA
             * =============================================
             */

            currentTarget =
              null;



            /*
             * =============================================
             * DESBLOQUEAR
             * =============================================
             */

            isLocked =
              false;



            console.log(
              "Imagen eliminada."
            );

            console.log(
              "Escaneo nuevamente disponible."
            );

          }
        );

      }
    );

  </script>


</body>

</html>
