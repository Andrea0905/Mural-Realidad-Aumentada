<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Historias que Inspiran</title>

  <link rel="stylesheet" href="./css/styles.css">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<script>
AFRAME.registerComponent('freeze-tracking', {

  schema: {
    factor: {
      type: 'number',
      default: 0.10
    }
  },

  init: function () {

    this.position = new THREE.Vector3();
    this.quaternion = new THREE.Quaternion();
    this.scale = new THREE.Vector3();

    this.initialized = false;
    this.frozen = false;

    this.el.addEventListener('freeze', () => {
      this.freeze();
    });

    this.el.addEventListener('unfreeze', () => {
      this.unfreeze();
    });
  },

  tick: function () {

    const object = this.el.object3D;

    /*
     * Si está congelado RESTAURAMOS
     * posición, rotación y escala guardadas.
     */
    if (this.frozen) {
      object.position.copy(this.position);
      object.quaternion.copy(this.quaternion);
      object.scale.copy(this.scale);
      return;
    }

    /*
     * Primera detección
     */
    if (!this.initialized) {

      this.position.copy(object.position);
      this.quaternion.copy(object.quaternion);
      this.scale.copy(object.scale);

      this.initialized = true;

      return;
    }

    /*
     * Suavizamos el movimiento mientras
     * todavía está siguiendo el marcador.
     */

    this.position.lerp(
      object.position,
      this.data.factor
    );

    this.quaternion.slerp(
      object.quaternion,
      this.data.factor
    );

    this.scale.lerp(
      object.scale,
      this.data.factor
    );

    object.position.copy(this.position);
    object.quaternion.copy(this.quaternion);
    object.scale.copy(this.scale);
  },

  freeze: function () {

    /*
     * Guardamos la posición exacta
     * donde fue detectado.
     */

    this.position.copy(this.el.object3D.position);
    this.quaternion.copy(this.el.object3D.quaternion);
    this.scale.copy(this.el.object3D.scale);

    this.frozen = true;

    console.log("Imagen congelada");
  },

  unfreeze: function () {

    this.frozen = false;
    this.initialized = false;

    console.log("Seguimiento reactivado");
  }

});
</script>
<script>

document.addEventListener("DOMContentLoaded", () => {

  const closeButton = document.getElementById("close-ar");

  const scene = document.querySelector("a-scene");

  let currentTarget = null;
  let isLocked = false;

  /*
   * ==========================================
   * CUANDO SE DETECTA UN TARGET
   * ==========================================
   */

  document.querySelectorAll(
    "[mindar-image-target]"
  ).forEach(target => {

    target.addEventListener("targetFound", () => {

      console.log(
        "Target encontrado:",
        target.getAttribute("data-person-id")
      );

      /*
       * Si ya hay un target congelado,
       * no permitimos detectar otro
       */

      if (isLocked) {
        return;
      }

      /*
       * Guardamos cuál es el target actual
       * y bloqueamos la detección de otros
       */

      currentTarget = target;
      isLocked = true;

      /*
       * Mostramos el botón X
       */

      closeButton.classList.add("visible");

      /*
       * Esperamos un pequeño momento para
       * permitir que MindAR establezca
       * correctamente la posición.
       */

      setTimeout(() => {

        if (currentTarget === target) {

          target.emit("freeze");

        }

      }, 300);

    });


    /*
     * ==========================================
     * CUANDO SE PIERDE EL TARGET
     * ==========================================
     */

    target.addEventListener("targetLost", () => {

      console.log(
        "Target perdido:",
        target.getAttribute("data-person-id")
      );

      /*
       * Si el target que se perdió es el actual
       * y está congelado, dejamos que permanezca
       * congelado hasta que se presione X
       */

    });

  });


  /*
   * ==========================================
   * BOTÓN X
   * ==========================================
   */

  closeButton.addEventListener("click", () => {

    console.log("Cerrar imagen AR");

    /*
     * Si existe un target congelado,
     * lo desbloqueamos y ocultamos
     */

    if (currentTarget) {

      currentTarget.emit("unfreeze");

      /*
       * Ocultamos la imagen permanentemente
       */

      currentTarget.object3D.visible = false;

    }

    /*
     * Ocultamos el botón
     */

    closeButton.classList.remove("visible");

    /*
     * Permitimos volver a escanear
     */

    currentTarget = null;
    isLocked = false;

  });

});

</script>
<body>

  <section
    id="story-card"
    class="story-card hidden"
    aria-live="polite"
  >
    <h2 id="story-name"></h2>

    <p id="story-quote"></p>

    <button
      id="audio-button"
      type="button"
    >
      ▶ Escuchar
    </button>

    <audio
      id="story-audio"
      preload="none"
    ></audio>
  </section>

  <button
    id="close-ar"
    type="button"
    aria-label="Cerrar realidad aumentada"
  >
    ✕
  </button>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets/targets.mind;
      uiError: yes;
      uiLoading: yes;
      uiScanning: no;
      missTolerance: 30;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ================================================= -->
    <!-- RECURSOS -->
    <!-- ================================================= -->

    <a-assets timeout="15000">

      <!-- PNG DE CADA MUJER -->

      <img
        id="overlay-denisse"
        src="./assets/images/denisse.png"
      >

      <img
        id="overlay-esther"
        src="./assets/images/esther-06.png"
      >

      <img
        id="overlay-rubi"
        src="./assets/images/rubí.png"
      >

      <img
        id="overlay-maria"
        src="./assets/images/maria.png"
      >

      <img
        id="overlay-patricia"
        src="./assets/images/patricia.png"
      >

      <img
        id="overlay-monica"
        src="./assets/images/monica.png"
      >


      <!-- MODELO ANIMADO DEL TARGET 0 -->

      <a-asset-item
        id="modelo-mujeres"
        src="./assets/models/mural.glb"
      >
      </a-asset-item>

    </a-assets>



    <!-- ================================================= -->
    <!-- CÁMARA -->
    <!-- ================================================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>



    <!-- ================================================= -->
    <!-- TARGET 0 -->
    <!-- MODELO MUJERES.GLB -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-person-id="titulo"
    >

      <a-gltf-model

        id="modelo-mujeres-ar"

        src="#modelo-mujeres"

        position="0 0 0.05"

        rotation="0 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer

      >
      </a-gltf-model>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 1: DENISSE -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 1"
      data-person-id="denisse"
      freeze-tracking
    >

      <a-image
        src="#overlay-denisse"
        position="0 0 0.05"
        width="0.97"
        height="2.09"
        transparent="true"
        
      >
      </a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 2: ESTHER -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 2"
      data-person-id="esther"
      freeze-tracking
    >

      <a-image
        src="#overlay-esther"
        position="0 0 0.05"
        width="0.97"
        height="2.09"
        transparent="true"
      >
      </a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 3: RUBÍ -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 3"
      data-person-id="rubi"
      freeze-tracking
    >

      <a-image
        src="#overlay-rubi"
        position="0 0 0.05"
        width="0.97"
        height="2.09"
        transparent="true"
      >
      </a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 4: MARÍA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 4"
      data-person-id="maria"
      freeze-tracking
    >

      <a-image
        src="#overlay-maria"
        position="0 0 0.05"
        width="0.97"
        height="2.09"
        transparent="true"
      >
      </a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 5: PATRICIA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 5"
      data-person-id="patricia"
      freeze-tracking
    >

      <a-image
        src="#overlay-patricia"
        position="0 0 0.05"
        width="0.97"
        height="2.09"
        transparent="true"
      >
      </a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 6: MÓNICA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 6"
      data-person-id="monica"

  <script src="./js/app.js"></script>
