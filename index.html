<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Historias que Inspiran</title>

  <link rel="stylesheet" href="./css/styles.css">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- A-Frame Extras -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>


  <!-- ================================================= -->
  <!-- TARJETA DE INFORMACIÓN -->
  <!-- ================================================= -->

  <section
    id="story-card"
    class="story-card hidden"
    aria-live="polite"
  >

    <h2 id="story-name"></h2>

    <p id="story-quote"></p>

    <button
      id="audio-button"
      type="button"
    >
      ▶ Escuchar
    </button>

    <audio
      id="story-audio"
      preload="none"
    ></audio>

  </section>


  <!-- ================================================= -->
  <!-- BOTÓN CERRAR -->
  <!-- ================================================= -->

  <button
    id="close-ar"
    type="button"
    aria-label="Cerrar realidad aumentada"
  >
    ✕
  </button>



  <!-- ================================================= -->
  <!-- ESCENA AR -->
  <!-- ================================================= -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets/targets.mind;
      uiError: yes;
      uiLoading: yes;
      uiScanning: no;
      missTolerance: 30;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ================================================= -->
    <!-- RECURSOS -->
    <!-- ================================================= -->

    <a-assets timeout="15000">


      <!-- =============================================== -->
      <!-- IMÁGENES DE LAS MUJERES -->
      <!-- =============================================== -->

      <img
        id="overlay-denisse"
        src="./assets/images/denisse.png"
      >

      <img
        id="overlay-esther"
        src="./assets/images/esther-06.png"
      >

      <img
        id="overlay-rubi"
        src="./assets/images/rubí.png"
      >

      <img
        id="overlay-maria"
        src="./assets/images/maria.png"
      >

      <img
        id="overlay-patricia"
        src="./assets/images/patricia.png"
      >

      <img
        id="overlay-monica"
        src="./assets/images/monica.png"
      >


      <!-- =============================================== -->
      <!-- MODELO 3D -->
      <!-- =============================================== -->

      <a-asset-item
        id="modelo-mujeres"
        src="./assets/models/mural.glb"
      ></a-asset-item>


    </a-assets>



    <!-- ================================================= -->
    <!-- CÁMARA -->
    <!-- ================================================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>



    <!-- ================================================= -->
    <!-- CONTENEDOR PARA LA IMAGEN CONGELADA -->
    <!-- ================================================= -->

    <a-entity
      id="frozen-overlay"
    ></a-entity>



    <!-- ================================================= -->
    <!-- TARGET 0 -->
    <!-- MODELO 3D DEL MURAL -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-person-id="titulo"
    >

      <a-gltf-model

        id="modelo-mujeres-ar"

        src="#modelo-mujeres"

        position="0 0 0.05"

        rotation="0 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer

      ></a-gltf-model>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 1: DENISSE -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 1"
      data-person-id="denisse"
    >

      <a-image

        src="#overlay-denisse"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 2: ESTHER -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 2"
      data-person-id="esther"
    >

      <a-image

        src="#overlay-esther"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 3: RUBÍ -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 3"
      data-person-id="rubi"
    >

      <a-image

        src="#overlay-rubi"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 4: MARÍA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 4"
      data-person-id="maria"
    >

      <a-image

        src="#overlay-maria"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 5: PATRICIA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 5"
      data-person-id="patricia"
    >

      <a-image

        src="#overlay-patricia"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 6: MÓNICA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 6"
      data-person-id="monica"
    >

      <a-image

        src="#overlay-monica"

        position="0 0 0.05"

        width="0.97"

        height="2.09"

        transparent="true"

      ></a-image>

    </a-entity>


  </a-scene>



  <!-- ================================================= -->
  <!-- TUS SCRIPTS -->
  <!-- ================================================= -->

  <script src="./js/audio.js"></script>

  <script src="./js/app.js"></script>

  <script src="./js/ar.js"></script>



  <!-- ================================================= -->
  <!-- CONTROL DE IMAGEN CONGELADA -->
  <!-- ================================================= -->

  <script>

    document.addEventListener("DOMContentLoaded", () => {


      /*
       * ================================================
       * ELEMENTOS
       * ================================================
       */

      const closeButton =
        document.getElementById("close-ar");

      const frozenOverlay =
        document.getElementById("frozen-overlay");


      /*
       * Target actualmente seleccionado
       */

      let currentTarget = null;


      /*
       * Imagen congelada
       */

      let frozenImage = null;


      /*
       * Evita detectar varias imágenes
       * al mismo tiempo
       */

      let isLocked = false;



      /*
       * ================================================
       * FUNCIÓN PARA CONGELAR LA IMAGEN
       * ================================================
       */

      function freezeImage(target) {


        /*
         * Buscar la imagen dentro del target
         */

        const image =
          target.querySelector("a-image");


        /*
         * Si no existe imagen,
         * no hacemos nada.
         */

        if (!image) {

          console.log(
            "Este target no contiene una imagen."
          );

          return;

        }



        /*
         * ==============================================
         * CREAR NUEVA IMAGEN
         * ==============================================
         */

        frozenImage =
          document.createElement("a-image");



        /*
         * Copiar textura
         */

        frozenImage.setAttribute(
          "src",
          image.getAttribute("src")
        );



        /*
         * Copiar ancho
         */

        frozenImage.setAttribute(
          "width",
          image.getAttribute("width")
        );



        /*
         * Copiar alto
         */

        frozenImage.setAttribute(
          "height",
          image.getAttribute("height")
        );



        /*
         * Mantener transparencia
         */

        frozenImage.setAttribute(
          "transparent",
          "true"
        );



        /*
         * ==============================================
         * OBTENER TRANSFORMACIÓN MUNDIAL
         * ==============================================
         */

        const worldPosition =
          new THREE.Vector3();

        const worldQuaternion =
          new THREE.Quaternion();

        const worldScale =
          new THREE.Vector3();



        /*
         * Actualizar matriz
         */

        image.object3D.updateWorldMatrix(
          true,
          false
        );



        /*
         * Separar posición,
         * rotación y escala
         */

        image.object3D.matrixWorld.decompose(

          worldPosition,

          worldQuaternion,

          worldScale

        );



        /*
         * ==============================================
         * APLICAR POSICIÓN
         * ==============================================
         */

        frozenImage.object3D.position.copy(
          worldPosition
        );



        /*
         * ==============================================
         * APLICAR ROTACIÓN
         * ==============================================
         */

        frozenImage.object3D.quaternion.copy(
          worldQuaternion
        );



        /*
         * ==============================================
         * APLICAR ESCALA
         * ==============================================
         */

        frozenImage.object3D.scale.copy(
          worldScale
        );



        /*
         * ==============================================
         * AGREGAR AL ESCENARIO
         * ==============================================
         */

        frozenOverlay.appendChild(
          frozenImage
        );



        /*
         * ==============================================
         * OCULTAR TARGET DE MINDAR
         * ==============================================
         *
         * Esto es MUY importante.
         *
         * MindAR deja de controlar visualmente
         * la imagen original.
         */

        target.object3D.visible = false;



        /*
         * ==============================================
         * MOSTRAR BOTÓN X
         * ==============================================
         */

        closeButton.classList.add(
          "visible"
        );



        console.log(
          "Imagen congelada:",
          target.getAttribute(
            "data-person-id"
          )
        );

      }



      /*
       * ================================================
       * DETECTAR TARGETS
       * ================================================
       */

      document
        .querySelectorAll(
          "[mindar-image-target]"
        )
        .forEach(target => {



          /*
           * ==============================================
           * TARGET ENCONTRADO
           * ==============================================
           */

          target.addEventListener(
            "targetFound",
            () => {


              console.log(
                "Target encontrado:",
                target.getAttribute(
                  "data-person-id"
                )
              );



              /*
               * Si ya hay una imagen congelada,
               * ignoramos otros targets.
               */

              if (isLocked) {

                return;

              }



              /*
               * Guardar target actual
               */

              currentTarget =
                target;



              /*
               * Bloquear detección
               */

              isLocked = true;



              /*
               * Esperar a que MindAR termine
               * de colocar correctamente la imagen.
               */

              setTimeout(
                () => {


                  /*
                   * Verificar que todavía
                   * sea el target seleccionado.
                   */

                  if (
                    currentTarget === target &&
                    isLocked
                  ) {

                    freezeImage(
                      target
                    );

                  }

                },
                500
              );

            }
          );



          /*
           * ==============================================
           * TARGET PERDIDO
           * ==============================================
           */

          target.addEventListener(
            "targetLost",
            () => {


              console.log(
                "Target perdido:",
                target.getAttribute(
                  "data-person-id"
                )
              );


              /*
               * NO hacemos nada.
               *
               * La copia congelada permanece.
               */

            }
          );

        });



      /*
       * ================================================
       * BOTÓN X
       * ================================================
       */

      closeButton.addEventListener(
        "click",
        () => {


          console.log(
            "Cerrando imagen AR..."
          );

          /*
           * ==============================================
           * ELIMINAR IMAGEN CONGELADA
           * ==============================================
           */

          if (frozenImage) {

            frozenImage.remove();

            frozenImage = null;

          }



          /*
           * ==============================================
           * RESTAURAR TARGET ORIGINAL
           * ==============================================
           */

          if (currentTarget) {

            currentTarget.object3D.visible =
              true;

          }



          /*
           * ==============================================
           * LIMPIAR TARGET
           * ==============================================
           */

          currentTarget = null;



          /*
           * ==============================================
           * DESBLOQUEAR ESCANEO
           * ==============================================
           */

          isLocked = false;



          /*
           * ==============================================
           * OCULTAR BOTÓN X
           * ==============================================
           */

          closeButton.classList.remove(
            "visible"
          );



          console.log(
            "Escaneo nuevamente activado."
          );

        }
      );

    });

  </script>


</body>

</html>
